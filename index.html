<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Texindo - Sample Masuk</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f7f8fa;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:20px;
}

header h1{
  margin:0;
  font-size:24px;
}

header p{
  margin:5px 0 0;
  color:#cbd5e1;
  font-size:12px;
}

.container{
  max-width:1400px;
  margin:auto;
  padding:20px;
}

.topbar{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.search{
  flex:1;
  min-width:230px;
  padding:11px;
  border:1px solid #d1d5db;
  border-radius:9px;
}

.btn{
  padding:10px 14px;
  border-radius:8px;
  border:1px solid #d1d5db;
  background:white;
  font-weight:bold;
  cursor:pointer;
}

.btn-dark{
  background:#111827;
  color:white;
  border-color:#111827;
}

.status{
  font-size:12px;
  color:#64748b;
}

.factories{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px;
  margin-bottom:15px;
}

.factory{
  padding:12px;
  background:white;
  border:1px solid #e5e7eb;
  border-radius:10px;
  cursor:pointer;
  text-align:center;
  font-weight:bold;
}

.factory.active{
  background:#111827;
  color:white;
}

.layout{
  display:grid;
  grid-template-columns:230px 1fr;
  gap:14px;
}

.sidebar,
.content{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:12px;
  padding:12px;
}

.sidebar h3{
  margin:0 0 10px;
  font-size:13px;
}

.dates{
  display:grid;
  gap:6px;
}

.date{
  padding:9px;
  border:1px solid #e5e7eb;
  border-radius:8px;
  cursor:pointer;
  background:white;
  text-align:left;
  font-weight:bold;
  font-size:11px;
}

.date.active{
  background:#eff6ff;
  border-color:#60a5fa;
  color:#1d4ed8;
}

.folder-title{
  font-weight:bold;
  margin-bottom:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:12px;
}

.card{
  border:1px solid #e5e7eb;
  border-radius:12px;
  overflow:hidden;
  background:white;
}

.pic{
  height:190px;
  background:#f8fafc;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.card-body{
  padding:11px;
}

.name{
  font-size:13px;
  font-weight:bold;
  word-break:break-word;
}

.meta{
  font-size:10px;
  color:#64748b;
  margin-top:4px;
}

.specs{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-top:8px;
}

.spec{
  border:1px solid #e5e7eb;
  border-radius:7px;
  padding:7px;
}

.spec small{
  display:block;
  font-size:8px;
  color:#64748b;
  font-weight:bold;
}

.spec b{
  font-size:10px;
}

.actions{
  display:flex;
  gap:6px;
  margin-top:10px;
}

.actions button{
  flex:1;
  padding:8px;
  border-radius:7px;
  border:1px solid #cbd5e1;
  background:white;
  font-size:9px;
  font-weight:bold;
  cursor:pointer;
}

.actions .response{
  background:#111827;
  color:white;
  border-color:#111827;
}

.empty{
  padding:40px;
  text-align:center;
  color:#64748b;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(15,23,42,.75);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.modal.hidden{
  display:none;
}

.modal-box{
  width:min(950px,98vw);
  max-height:94vh;
  overflow:auto;
  background:white;
  border-radius:14px;
  padding:15px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
}

.modal-head h2{
  margin:0;
}

.preview{
  display:grid;
  grid-template-columns:300px 1fr;
  gap:14px;
  margin:15px 0;
  padding:10px;
  border:2px solid #111827;
  border-radius:10px;
}

.preview img{
  width:100%;
  height:230px;
  object-fit:contain;
  background:#f8fafc;
}

.form{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.form label{
  font-size:10px;
  font-weight:bold;
  color:#64748b;
}

.form input,
.form textarea{
  width:100%;
  margin-top:4px;
  padding:9px;
  border:1px solid #cbd5e1;
  border-radius:7px;
}

.full{
  grid-column:1/-1;
}

.modal-actions{
  margin-top:12px;
  display:flex;
  gap:8px;
}

@media(max-width:800px){
  .factories{
    grid-template-columns:repeat(2,1fr);
  }

  .layout{
    grid-template-columns:1fr;
  }

  .preview{
    grid-template-columns:1fr;
  }

  .form{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>PT ROYAL TEXINDO</h1>
  <p>Sample Masuk • Sinkron Google Drive • Tahun 2026</p>
</header>

<div class="container">

  <div class="topbar">
    <input
      id="search"
      class="search"
      placeholder="Cari nama barang, kode, tanggal..."
    >

    <button class="btn btn-dark" onclick="syncData()">
      ↻ Sinkronkan
    </button>

    <span id="status" class="status">
      Memuat data...
    </span>
  </div>

  <div id="factories" class="factories"></div>

  <div class="layout">

    <div class="sidebar">
      <h3>Folder Tanggal</h3>
      <div id="dates" class="dates"></div>
    </div>

    <div class="content">
      <div id="folderTitle" class="folder-title"></div>
      <div id="grid" class="grid"></div>
    </div>

  </div>

</div>


<div id="responseModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-head">
      <div>
        <h2>Buat Respon Sample</h2>
        <div class="status">
          Dibuka langsung di aplikasi
        </div>
      </div>

      <button class="btn" onclick="closeResponse()">
        ✕
      </button>
    </div>


    <div id="preview" class="preview"></div>


    <div class="form">

      <label>
        Tanggal
        <input id="respDate" type="date">
      </label>

      <label>
        Pabrik
        <input id="respFactory" readonly>
      </label>

      <label>
        Barang
        <input id="respName" readonly>
      </label>

      <label>
        Construction
        <input id="respConstruction">
      </label>

      <label>
        Color
        <input id="respColor">
      </label>

      <label>
        No PO
        <input id="respPO">
      </label>

      <label class="full">
        Note / Respon
        <textarea id="respNote" rows="5"></textarea>
      </label>

    </div>


    <div class="modal-actions">

      <button class="btn btn-dark" onclick="window.print()">
        Cetak / Simpan PDF
      </button>

      <button class="btn" onclick="shareResponse()">
        Bagikan
      </button>

      <button class="btn" onclick="closeResponse()">
        Tutup
      </button>

    </div>

  </div>
</div>


<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbxbD0VDOQpdCL0vUH1ut9c0SgPVM2_4uZ62R4ga-pXd_6xhZamSofA63VgPWWCM_3cbrg/exec';

const FACTORIES = [
  'RE',
  'RX',
  'WS',
  'RY',
  'KAHATEX'
];

let DATA = [];

let currentFactory = 'RE';
let currentDate = '';
let currentItem = null;


function esc(value){
  return String(value ?? '')
    .replace(/[&<>"]/g,function(c){
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;'
      }[c];
    });
}


function jsonp(url){

  return new Promise(function(resolve,reject){

    const callback =
      'callback_' +
      Date.now() +
      '_' +
      Math.random().toString(36).slice(2);

    const script =
      document.createElement('script');

    const timeout =
      setTimeout(function(){

        delete window[callback];
        script.remove();

        reject(
          new Error('Waktu koneksi habis.')
        );

      },30000);


    window[callback] =
      function(data){

        clearTimeout(timeout);

        delete window[callback];

        script.remove();

        resolve(data);
      };


    script.onerror =
      function(){

        clearTimeout(timeout);

        delete window[callback];

        script.remove();

        reject(
          new Error(
            'Gagal terhubung ke Google Apps Script.'
          )
        );
      };


    script.src =
      url +
      '?callback=' +
      callback +
      '&t=' +
      Date.now();

    document.head.appendChild(script);

  });

}


async function syncData(){

  document.getElementById('status').textContent =
    'Menyinkronkan...';

  try{

    const result =
      await jsonp(API_URL);

    if(
      !result ||
      result.ok !== true ||
      !Array.isArray(result.sample)
    ){
      throw new Error(
        result?.error ||
        'Data API tidak valid.'
      );
    }


    DATA =
      result.sample
      .filter(function(x){

        const factory =
          String(
            x.factory ||
            x.pabrik ||
            ''
          )
          .toUpperCase()
          .trim();

        const date =
          String(
            x.date ||
            x.folderDate ||
            ''
          );

        return (
          FACTORIES.includes(factory) &&
          date.startsWith('2026-')
        );

      })
      .map(function(x){

        x.factory =
          String(
            x.factory ||
            x.pabrik
          )
          .toUpperCase();

        x.date =
          String(
            x.date ||
            x.folderDate
          );

        return x;

      });


    document.getElementById('status').textContent =
      'Tersinkron • ' +
      DATA.length +
      ' file';


    chooseLatestDate();

    render();

  }
  catch(error){

    console.error(error);

    document.getElementById('status').textContent =
      'Sinkron gagal';

    document.getElementById('grid').innerHTML =
      '<div class="empty">' +
      '<b>Data gagal dimuat.</b><br><br>' +
      esc(error.message) +
      '</div>';

  }

}


function chooseLatestDate(){

  const dates =
    [...new Set(
      DATA
      .filter(function(x){
        return x.factory === currentFactory;
      })
      .map(function(x){
        return x.date;
      })
    )]
    .sort()
    .reverse();


  if(
    !currentDate ||
    !dates.includes(currentDate)
  ){
    currentDate =
      dates[0] || '';
  }

}


function renderFactories(){

  const box =
    document.getElementById('factories');

  box.innerHTML =
    FACTORIES
    .map(function(factory){

      const count =
        DATA.filter(function(x){
          return x.factory === factory;
        }).length;

      return `
        <button
          class="factory
          ${factory===currentFactory?'active':''}"
          onclick="selectFactory('${factory}')"
        >
          ${factory}<br>
          <small>${count} file</small>
        </button>
      `;

    })
    .join('');

}


function selectFactory(factory){

  currentFactory = factory;

  currentDate = '';

  chooseLatestDate();

  render();

}


function renderDates(){

  const dates =
    [...new Set(
      DATA
      .filter(function(x){
        return x.factory === currentFactory;
      })
      .map(function(x){
        return x.date;
      })
    )]
    .sort()
    .reverse();


  const box =
    document.getElementById('dates');


  if(!dates.length){

    box.innerHTML =
      '<div class="status">Belum ada folder.</div>';

    return;
  }


  box.innerHTML =
    dates
    .map(function(date){

      const count =
        DATA.filter(function(x){

          return (
            x.factory === currentFactory &&
            x.date === date
          );

        }).length;


      return `
        <button
          class="date
          ${date===currentDate?'active':''}"
          onclick="selectDate('${date}')"
        >

          <span>
            📁 ${date}
          </span>

          <span>
            ${count}
          </span>

        </button>
      `;

    })
    .join('');

}


function selectDate(date){

  currentDate = date;

  renderGrid();

  renderDates();

}


function imageUrl(item){

  if(item.imageUrl){
    return item.imageUrl;
  }

  if(item.thumbnailUrl){
    return item.thumbnailUrl;
  }

  if(item.id){
    return (
      'https://drive.google.com/thumbnail?id=' +
      encodeURIComponent(item.id) +
      '&sz=w1200'
    );
  }

  return '';

}


function construction(item){

  if(item.construction){
    return item.construction;
  }


  const name =
    String(item.name || '');


  const matches =
    [...name.matchAll(
      /(\d{1,4})\s*[xX×*]\s*(\d{1,4})/g
    )];


  if(matches.length){

    return matches
      .slice(0,2)
      .map(function(m){
        return m[1] + 'x' + m[2];
      })
      .join(' / ');

  }


  return '';

}


function color(item){

  if(item.color){
    return item.color;
  }


  const name =
    String(item.name || '')
    .toUpperCase();


  const colors = [

    'BLACK',
    'WHITE',
    'CREAM',
    'KHAKY',
    'KHAKI',
    'NAVY',
    'BROWN',
    'GREY',
    'GRAY',
    'OLIVE',
    'CAMEL',
    'MOCCA',
    'BEIGE',
    'BLUE',
    'TAUPE',
    'CHARCOAL',
    'MINT'

  ];


  return (
    colors.find(function(c){
      return name.includes(c);
    }) || ''
  );

}


function renderGrid(){

  const search =
    document
    .getElementById('search')
    .value
    .toLowerCase()
    .trim();


  let rows =
    DATA.filter(function(x){

      if(
        x.factory !== currentFactory ||
        x.date !== currentDate
      ){
        return false;
      }


      if(!search){
        return true;
      }


      return [
        x.name,
        x.title,
        x.factory,
        x.date,
        x.path
      ]
      .join(' ')
      .toLowerCase()
      .includes(search);

    });


  document.getElementById('folderTitle').textContent =
    currentFactory +
    (currentDate
      ? ' • ' + currentDate
      : ''
    );


  const box =
    document.getElementById('grid');


  if(!rows.length){

    box.innerHTML =
      '<div class="empty">' +
      '<b>Tidak ada barang.</b>' +
      '</div>';

    return;
  }


  box.innerHTML =
    rows
    .map(function(item){

      const image =
        imageUrl(item);

      const cons =
        construction(item);

      const col =
        color(item);


      return `
        <div class="card">

          <div class="pic">

            ${
              image
              ?
              `<img
                src="${esc(image)}"
                alt="${esc(item.name)}"
                loading="lazy"
              >`
              :
              'Belum ada gambar'
            }

          </div>


          <div class="card-body">

            <div class="name">
              ${esc(item.name || 'Sample')}
            </div>

            <div class="meta">
              ${esc(item.factory)}
              •
              ${esc(item.date)}
            </div>


            <div class="specs">

              <div class="spec">

                <small>
                  Construction
                </small>

                <b>
                  ${esc(cons || '-')}
                </b>

              </div>


              <div class="spec">

                <small>
                  Color
                </small>

                <b>
                  ${esc(col || '-')}
                </b>

              </div>

            </div>


            <div class="actions">

              <button
                class="response"
                onclick="openResponse('${item.id}')"
              >
                BUAT RESPON
              </button>


              <button
                onclick="openDrive('${item.id}')"
              >
                BUKA
              </button>

            </div>

          </div>

        </div>
      `;

    })
    .join('');

}


function render(){

  chooseLatestDate();

  renderFactories();

  renderDates();

  renderGrid();

}


function openDrive(id){

  const item =
    DATA.find(function(x){
      return String(x.id) === String(id);
    });


  if(!item){
    return;
  }


  const url =
    item.driveUrl ||
    item.url;


  if(url){

    window.open(
      url,
      '_blank'
    );

  }

}


function openResponse(id){

  const item =
    DATA.find(function(x){
      return String(x.id) === String(id);
    });


  if(!item){
    return;
  }


  currentItem =
    item;


  const cons =
    construction(item);

  const col =
    color(item);

  const image =
    imageUrl(item);


  document.getElementById('preview').innerHTML =
    `

      <div>

        ${
          image
          ?
          `<img src="${esc(image)}">`
          :
          'Belum ada gambar'
        }

      </div>


      <div>

        <h3>
          ${esc(item.name)}
        </h3>

        <p>
          <b>Pabrik:</b>
          ${esc(item.factory)}
        </p>

        <p>
          <b>Tanggal:</b>
          ${esc(item.date)}
        </p>

        <p>
          <b>Construction:</b>
          ${esc(cons || '-')}
        </p>

        <p>
          <b>Color:</b>
          ${esc(col || '-')}
        </p>

      </div>

    `;


  document.getElementById('respDate').value =
    new Date()
    .toISOString()
    .slice(0,10);


  document.getElementById('respFactory').value =
    item.factory;


  document.getElementById('respName').value =
    item.name || '';


  document.getElementById('respConstruction').value =
    cons || '';


  document.getElementById('respColor').value =
    col || '';


  document.getElementById('respPO').value =
    '';


  document.getElementById('respNote').value =
    '';


  document
  .getElementById('responseModal')
  .classList
  .remove('hidden');

}


function closeResponse(){

  document
  .getElementById('responseModal')
  .classList
  .add('hidden');

}


async function shareResponse(){

  if(!currentItem){
    return;
  }


  const text =
`
RESPON SAMPLE KAIN

Pabrik:
${document.getElementById('respFactory').value}

Tanggal:
${document.getElementById('respDate').value}

Barang:
${document.getElementById('respName').value}

Construction:
${document.getElementById('respConstruction').value || '-'}

Color:
${document.getElementById('respColor').value || '-'}

No PO:
${document.getElementById('respPO').value || '-'}

Note:
${document.getElementById('respNote').value || '-'}
`;


  if(navigator.share){

    try{

      await navigator.share({
        title:
          'Respon Sample ' +
          currentItem.name,
        text:text
      });

    }
    catch(error){}

  }
  else{

    await navigator.clipboard.writeText(text);

    alert(
      'Teks respon sudah disalin.'
    );

  }

}


document
.getElementById('search')
.addEventListener(
  'input',
  renderGrid
);


syncData();

</script>

</body>
</html>
