<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Royal Texindo — Sample Masuk</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="brand">PT ROYAL TEXINDO</div>
      <h1>Sample Masuk</h1>
      <div class="sub">Sinkron langsung dari Google Drive • Tahun 2026</div>
    </div>
    <div class="top-actions">
      <span id="syncState" class="badge">Memuat...</span>
      <button id="refreshBtn" class="btn">↻ Sinkronkan</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <input id="searchInput" placeholder="Cari nama kain, kode, tanggal...">
      <div id="factoryTabs" class="tabs"></div>
    </section>

    <section class="statusline">
      <div><b id="factoryTitle">RE</b> <span id="itemCount"></span></div>
      <div id="lastUpdated"></div>
    </section>

    <div class="layout">
      <aside>
        <div class="aside-title">Folder tanggal</div>
        <div id="dateList" class="date-list"></div>
      </aside>

      <section class="content">
        <div id="currentFolder" class="current-folder"></div>
        <div id="grid" class="grid"></div>
      </section>
    </div>
  </main>

  <div id="responseModal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card">
      <div class="modal-head">
        <div>
          <h2>Buat Respon Sample</h2>
          <div class="muted">Respon dibuat langsung di aplikasi, tidak membuka Google Drive.</div>
        </div>
        <button class="icon-btn" data-close>×</button>
      </div>

      <div id="responsePreview" class="response-preview"></div>

      <div class="form-grid">
        <label>Tanggal dibuat
          <input id="respDate" type="date">
        </label>
        <label>Pabrik
          <input id="respFactory" readonly>
        </label>
        <label>Nama / kode barang
          <input id="respName" readonly>
        </label>
        <label>Construction
          <input id="respConstruction" placeholder="Contoh: 40x40 / 132x70">
        </label>
        <label>Color
          <input id="respColor" placeholder="Color No / nama warna">
        </label>
        <label>No. PO
          <input id="respPO" placeholder="No. PO">
        </label>
        <label class="wide">Note / respon
          <textarea id="respNote" rows="5" placeholder="Tulis respon di sini..."></textarea>
        </label>
      </div>

      <div class="modal-actions">
        <button id="printRespBtn" class="btn primary">Cetak / Simpan PDF</button>
        <button id="shareRespBtn" class="btn">Bagikan</button>
        <button class="btn" data-close>Tutup</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
